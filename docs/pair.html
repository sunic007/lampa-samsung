<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Lampa — подключить Telegram</title>
<style>
  /* вид — как у приложения TV Installer и у страницы, которую отдаёт ТВ (service.js, PAIR_CSS): тёмная тема, Sky */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000000; color: #F2F3F5; font: 16px/1.45 "Bahnschrift", "Segoe UI", Roboto, system-ui, sans-serif; }
  .w { max-width: 420px; margin: 0 auto; padding: 28px 16px 32px; }
  .ic { width: 64px; height: 64px; border-radius: 18px; background: #1B1C1F; border: 1px solid #26282C; display: flex; align-items: center; justify-content: center; margin: 0 0 18px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; }
  .sub { color: #A6ABB3; margin: 0 0 20px; }
  .card { background: #1B1C1F; border: 1px solid #26282C; border-radius: 20px; padding: 16px; margin: 0 0 18px; }
  .st { display: flex; align-items: flex-start; margin: 0 0 12px; } .st:last-child { margin: 0; }
  .n { flex: 0 0 28px; height: 28px; margin-right: 12px; border-radius: 50%; background: #11374F; color: #CDE7FF; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  label { display: block; color: #A6ABB3; font-size: 14px; margin: 0 0 8px; }
  textarea { display: block; width: 100%; min-height: 96px; padding: 14px 16px; border-radius: 16px; border: 1px solid #565A62; background: #1B1C1F; color: #F2F3F5; font: 15px/1.4 monospace; outline: 0; resize: vertical; }
  textarea:focus { border-color: #4599FF; }
  button { display: block; width: 100%; height: 56px; margin: 14px 0 0; padding: 0 16px; border: 0; border-radius: 28px; background: #4599FF; color: #000000; font-family: inherit; font-size: 17px; font-weight: 700; }
  button:disabled { opacity: .6; }
  .m { margin: 16px 0 0; border-radius: 16px; padding: 12px 14px; white-space: pre-wrap; }
  .m:empty { display: none; }
  .ok { background: #0E3B2E; color: #C6F3E1; } .err { background: #4A1E22; color: #FFD9DC; } .warn { background: #4A3313; color: #FFC46B; }
</style>
</head>
<body>
<div class="w">
<div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4599FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 7.5v6M9.5 11l2.5 2.5 2.5-2.5"/></svg></div>
<h1 id="h">Подключение Telegram-бота</h1>
<p class="sub" id="sub">Вставьте токен бота — Lampa на телевизоре подключится сама.</p>
<div class="card">
  <div class="st"><span class="n">1</span><span id="s1">Откройте @BotFather → /newbot (или /mybots → бот → API Token)</span></div>
  <div class="st"><span class="n">2</span><span id="s2">Скопируйте токен и вставьте ниже</span></div>
  <div class="st"><span class="n">3</span><span id="s3">Нажмите «Отправить на ТВ»</span></div>
</div>
<label for="t" id="lbl">Токен бота от @BotFather</label>
<textarea id="t" placeholder="123456789:AA…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="b">Отправить на ТВ</button>
<div id="s" class="m"></div>
</div>
<script>
  /* ---------- шифрование и подпись сообщений через ntfy (ES5, без WebCrypto: старые ТВ) ----------
   * SHA-256 и HMAC-SHA256 на чистом JS. seal: поток HMAC(ключ шифрования, nonce|счётчик) XOR текст, подпись
   * HMAC(ключ подписи, nonce|шифртекст) — подделать, прочитать или изменить сообщение без ключа нельзя.
   * Та же копия — в docs/pair.html (страница на телефоне шифрует токен). */
  var Crypt = (function () {
      var K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
      function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
      /** SHA-256 массива байт -> массив из 32 байт. */
      function sha256(msg) {
          var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
          var m = msg.slice(0), bitLen = msg.length * 8, i, j;
          m.push(0x80);
          while (m.length % 64 !== 56) m.push(0);
          for (i = 7; i >= 0; i--) m.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
          var w = new Array(64);
          for (var off = 0; off < m.length; off += 64) {
              for (i = 0; i < 16; i++) w[i] = (m[off + i * 4] << 24) | (m[off + i * 4 + 1] << 16) | (m[off + i * 4 + 2] << 8) | m[off + i * 4 + 3];
              for (i = 16; i < 64; i++) {
                  var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                  var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                  w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
              }
              var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
              for (i = 0; i < 64; i++) {
                  var t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
                  var t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
                  hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
              }
              h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
              h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
          }
          var out = [];
          for (i = 0; i < 8; i++) for (j = 3; j >= 0; j--) out.push((h[i] >>> (j * 8)) & 255);
          return out;
      }
      function hmac(key, msg) {
          if (key.length > 64) key = sha256(key);
          var ik = [], ok = [];
          for (var i = 0; i < 64; i++) { var k = key[i] || 0; ik.push(k ^ 0x36); ok.push(k ^ 0x5c); }
          return sha256(ok.concat(sha256(ik.concat(msg))));
      }
      function bytes(s) { var u = unescape(encodeURIComponent(String(s))), b = []; for (var i = 0; i < u.length; i++) b.push(u.charCodeAt(i)); return b; }
      function text(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return decodeURIComponent(escape(s)); }
      function b64(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
      function unb64(s) { var r = atob(String(s || '')), b = []; for (var i = 0; i < r.length; i++) b.push(r.charCodeAt(i)); return b; }
      function hex(b) { var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s; }
      function rnd(n) {
          var a = [], i;
          try {
              var c = window.crypto || window.msCrypto, u = new Uint8Array(n);
              c.getRandomValues(u);
              for (i = 0; i < n; i++) a.push(u[i]);
              return a;
          } catch (e) {}
          for (i = 0; i < n; i++) a.push(Math.floor(Math.random() * 256));
          return a;
      }
      function stream(ek, nonce, data) {
          var out = [];
          for (var i = 0; i < data.length; i += 32) {
              var ks = hmac(ek, nonce.concat([(i >>> 24) & 255, (i >>> 16) & 255, (i >>> 8) & 255, i & 255]));
              for (var j = 0; j < 32 && i + j < data.length; j++) out.push(data[i + j] ^ ks[j]);
          }
          return out;
      }
      /** Ключ из строки (токен, код, секрет из QR). */
      function key(str) { return sha256(bytes(str)); }
      /** Зашифровать и подписать строку: {z:2, n, c, s}. */
      function seal(k, str) {
          var n = rnd(16), ct = stream(hmac(k, bytes('enc')), n, bytes(str));
          return { z: 2, n: b64(n), c: b64(ct), s: b64(hmac(hmac(k, bytes('mac')), n.concat(ct)).slice(0, 16)) };
      }
      /** Проверить подпись и расшифровать; чужое или изменённое — null. */
      function open(k, m) {
          try {
              if (!m || m.z !== 2) return null;
              var n = unb64(m.n), ct = unb64(m.c), tag = unb64(m.s);
              if (n.length !== 16 || tag.length !== 16) return null;
              var want = hmac(hmac(k, bytes('mac')), n.concat(ct)).slice(0, 16), diff = 0;
              for (var i = 0; i < 16; i++) diff |= want[i] ^ tag[i];
              if (diff) return null;
              return text(stream(hmac(k, bytes('enc')), n, ct));
          } catch (e) { return null; }
      }
      /** Случайный секрет для QR: 22 символа без похожих букв. */
      function secret() {
          var a = 'abcdefghijkmnpqrstuvwxyz23456789', r = rnd(22), s = '';
          for (var i = 0; i < r.length; i++) s += a.charAt(r[i] % a.length);
          return s;
      }
      return { sha256: sha256, hmac: hmac, bytes: bytes, hex: hex, key: key, seal: seal, open: open, secret: secret };
  })();

  // В адресе после #: тема ntfy, которую слушает ТВ, и (новые ТВ) секрет через точку — токен шифруется им,
  // в кэше ntfy его не прочитать. Без секрета (старая Lampa) токен уходит как есть.
  // Серверы ntfy — как RELAYS в bstg.js: ТВ слушает тему на всех. Отправляем в первый; ответил 429 (у ntfy.sh — 250
  // сообщений в сутки на IP, а дома IP общий), 5xx или нет связи — молча в следующий. Человеку — только итог.
  var RELAYS = ['https://ntfy.sh/', 'https://ntfy.envs.net/', 'https://ntfy.adminforge.de/', 'https://ntfy.hostux.net/'];
  // язык — телефона: ru / en / uz (украинский, казахский и т. п. — русский), остальное — английский
  var lang = (function () {
    var l = String((navigator.languages && navigator.languages[0]) || navigator.language || 'ru').toLowerCase().slice(0, 2);
    return l === 'uz' ? 'uz' : /^(ru|uk|be|kk|ky|tg)$/.test(l) ? 'ru' : 'en';
  })();
  var T = {
    ru: { qr: 'Откройте эту страницу через QR-код на экране ТВ.', bad: 'Это не похоже на токен бота. Скопируйте его у @BotFather целиком.', sending: 'Отправляю…',
      ok: '✅ Отправлено. На ТВ появится «Токен получен» — теперь напишите своему боту любое сообщение.',
      limit: 'Серверы передачи сейчас не принимают сообщения из вашей сети (суточный лимит). Выключите Wi-Fi на телефоне, откройте эту страницу через мобильный интернет и нажмите ещё раз — или попробуйте позже.',
      fail: 'Не отправилось ({s}). Попробуйте ещё раз.', net: 'Нет связи — проверьте интернет и нажмите ещё раз.' },
    en: { h: 'Connect a Telegram bot', sub: 'Paste the bot token — Lampa on the TV connects by itself.', s1: 'Open @BotFather → /newbot (or /mybots → bot → API Token)',
      s2: 'Copy the token and paste it below', s3: 'Tap “Send to TV”', lbl: 'Bot token from @BotFather', b: 'Send to TV', qr: 'Open this page with the QR code on the TV screen.', bad: "This doesn't look like a bot token. Copy the whole token from @BotFather.", sending: 'Sending…',
      ok: '✅ Sent. The TV will show “Token received” — now send your bot any message.',
      limit: "The relay servers don't accept messages from your network right now (daily limit). Turn off Wi-Fi on the phone, open this page over mobile data and tap again — or try later.",
      fail: "Didn't send ({s}). Try again.", net: 'No connection — check the internet and tap again.' },
    uz: { h: 'Telegram botni ulash', sub: "Bot tokenini qo'ying — televizordagi Lampa o'zi ulanadi.", s1: "@BotFather'ni oching → /newbot (yoki /mybots → bot → API Token)",
      s2: "Tokenni nusxalab, pastga qo'ying", s3: '«Televizorga yuborish» tugmasini bosing', lbl: '@BotFather bergan bot tokeni', b: 'Televizorga yuborish', qr: 'Bu sahifani televizor ekranidagi QR-kod orqali oching.', bad: "Bu bot tokeniga o'xshamaydi. Uni @BotFather'dan to'liq nusxalang.", sending: 'Yuboryapman…',
      ok: '✅ Yuborildi. Televizorda «Token olindi» chiqadi — endi botingizga istalgan xabar yozing.',
      limit: "Uzatish serverlari hozir tarmog'ingizdan xabar qabul qilmayapti (kunlik limit). Telefonda Wi-Fi'ni o'chiring, sahifani mobil internet orqali oching va qayta bosing — yoki keyinroq urinib ko'ring.",
      fail: "Yuborilmadi ({s}). Qayta urinib ko'ring.", net: "Aloqa yo'q — internetni tekshirib, qayta bosing." }
  }[lang];
  ['h', 'sub', 's1', 's2', 's3', 'lbl', 'b'].forEach(function (id) { if (T[id]) document.getElementById(id).textContent = T[id]; });
  if (lang !== 'ru') document.documentElement.lang = lang;
  var hash = (location.hash || '').replace(/^#/, '').split('.'), topic = hash[0], secret = hash[1] || '';
  // итог — в цветной плашке: ok — Mint, err — Rose, warn (отправляю) — Amber
  var st = function (t, cls) { var e = document.getElementById('s'); e.textContent = t; e.className = 'm ' + (cls || 'warn'); };
  if (!/^lampa-[a-z0-9]{8,40}$/.test(topic)) st(T.qr, 'err');
  /** В первый сервер, который примет. cb(статус: < 300 — принят; 429 — где-то был лимит; 0 — нигде нет связи). */
  function post(body, cb) {
    var limit = false, last = 0;
    (function next(i) {
      if (i >= RELAYS.length) return cb(limit ? 429 : last);
      var x = new XMLHttpRequest(), done = false;
      var fin = function (s) {
        if (done) return;
        done = true;
        if (s && s < 300) return cb(s);
        if (s === 429) limit = true; else if (s) last = s;
        next(i + 1);
      };
      try {
        x.open('POST', RELAYS[i] + topic, true);
        x.timeout = 20000;
        x.onload = function () { fin(x.status); };
        x.onerror = x.ontimeout = function () { fin(0); };
        x.send(body);
      } catch (e) { fin(0); }
    })(0);
  }
  document.getElementById('b').onclick = function () {
    var tok = document.getElementById('t').value.replace(/\s+/g, '');
    var m = /(\d{6,12}:[A-Za-z0-9_-]{30,})/.exec(tok);
    if (!m) return st(T.bad, 'err');
    if (!/^lampa-[a-z0-9]{8,40}$/.test(topic)) return st(T.qr, 'err');
    var b = this; b.disabled = true; st(T.sending);
    post(secret ? JSON.stringify(Crypt.seal(Crypt.key('lampa-pair-v2|' + secret), m[1])) : m[1], function (s) {
      b.disabled = false;
      if (s && s < 300) st(T.ok, 'ok');
      else if (s === 429) st(T.limit, 'err');
      else if (s) st(T.fail.replace('{s}', s), 'err');
      else st(T.net, 'err');
    });
  };
</script>
</body>
</html>

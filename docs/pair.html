<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lampa — подключить Telegram</title>
<style>
  :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; --accent: #2a6df4; --ok: #2e9d57; --err: #d9534f; --field: #222; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  textarea { width: 100%; min-height: 90px; padding: 12px; border-radius: 12px; border: 1px solid #333; background: var(--field); color: var(--fg); font: 16px monospace; }
  button { width: 100%; margin-top: 12px; padding: 15px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 18px; }
  button:disabled { opacity: .6; }
  #s { margin-top: 14px; font-size: 17px; white-space: pre-wrap; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  ol { padding-left: 20px; color: var(--muted); }
</style>
</head>
<body>
<h1>Подключить Telegram к Lampa</h1>
<ol>
  <li>В Telegram: <b>@BotFather</b> → <b>/newbot</b> → придумайте имя → нажмите на токен, чтобы скопировать.</li>
  <li>Вставьте токен сюда и нажмите «Отправить на ТВ».</li>
  <li>Напишите своему боту любое сообщение.</li>
</ol>
<textarea id="t" placeholder="123456789:AA…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="b">Отправить на ТВ</button>
<div id="s"></div>
<script>
  /* ---------- шифрование и подпись сообщений через ntfy (ES5, без WebCrypto: старые ТВ) ----------
   * SHA-256 и HMAC-SHA256 на чистом JS. seal: поток HMAC(ключ шифрования, nonce|счётчик) XOR текст, подпись
   * HMAC(ключ подписи, nonce|шифртекст) — подделать, прочитать или изменить сообщение без ключа нельзя.
   * Та же копия — в docs/pair.html (страница на телефоне шифрует токен). */
  var Crypt = (function () {
      var K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
      function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
      /** SHA-256 массива байт -> массив из 32 байт. */
      function sha256(msg) {
          var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
          var m = msg.slice(0), bitLen = msg.length * 8, i, j;
          m.push(0x80);
          while (m.length % 64 !== 56) m.push(0);
          for (i = 7; i >= 0; i--) m.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
          var w = new Array(64);
          for (var off = 0; off < m.length; off += 64) {
              for (i = 0; i < 16; i++) w[i] = (m[off + i * 4] << 24) | (m[off + i * 4 + 1] << 16) | (m[off + i * 4 + 2] << 8) | m[off + i * 4 + 3];
              for (i = 16; i < 64; i++) {
                  var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                  var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                  w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
              }
              var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
              for (i = 0; i < 64; i++) {
                  var t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
                  var t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
                  hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
              }
              h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
              h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
          }
          var out = [];
          for (i = 0; i < 8; i++) for (j = 3; j >= 0; j--) out.push((h[i] >>> (j * 8)) & 255);
          return out;
      }
      function hmac(key, msg) {
          if (key.length > 64) key = sha256(key);
          var ik = [], ok = [];
          for (var i = 0; i < 64; i++) { var k = key[i] || 0; ik.push(k ^ 0x36); ok.push(k ^ 0x5c); }
          return sha256(ok.concat(sha256(ik.concat(msg))));
      }
      function bytes(s) { var u = unescape(encodeURIComponent(String(s))), b = []; for (var i = 0; i < u.length; i++) b.push(u.charCodeAt(i)); return b; }
      function text(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return decodeURIComponent(escape(s)); }
      function b64(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
      function unb64(s) { var r = atob(String(s || '')), b = []; for (var i = 0; i < r.length; i++) b.push(r.charCodeAt(i)); return b; }
      function hex(b) { var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s; }
      function rnd(n) {
          var a = [], i;
          try {
              var c = window.crypto || window.msCrypto, u = new Uint8Array(n);
              c.getRandomValues(u);
              for (i = 0; i < n; i++) a.push(u[i]);
              return a;
          } catch (e) {}
          for (i = 0; i < n; i++) a.push(Math.floor(Math.random() * 256));
          return a;
      }
      function stream(ek, nonce, data) {
          var out = [];
          for (var i = 0; i < data.length; i += 32) {
              var ks = hmac(ek, nonce.concat([(i >>> 24) & 255, (i >>> 16) & 255, (i >>> 8) & 255, i & 255]));
              for (var j = 0; j < 32 && i + j < data.length; j++) out.push(data[i + j] ^ ks[j]);
          }
          return out;
      }
      /** Ключ из строки (токен, код, секрет из QR). */
      function key(str) { return sha256(bytes(str)); }
      /** Зашифровать и подписать строку: {z:2, n, c, s}. */
      function seal(k, str) {
          var n = rnd(16), ct = stream(hmac(k, bytes('enc')), n, bytes(str));
          return { z: 2, n: b64(n), c: b64(ct), s: b64(hmac(hmac(k, bytes('mac')), n.concat(ct)).slice(0, 16)) };
      }
      /** Проверить подпись и расшифровать; чужое или изменённое — null. */
      function open(k, m) {
          try {
              if (!m || m.z !== 2) return null;
              var n = unb64(m.n), ct = unb64(m.c), tag = unb64(m.s);
              if (n.length !== 16 || tag.length !== 16) return null;
              var want = hmac(hmac(k, bytes('mac')), n.concat(ct)).slice(0, 16), diff = 0;
              for (var i = 0; i < 16; i++) diff |= want[i] ^ tag[i];
              if (diff) return null;
              return text(stream(hmac(k, bytes('enc')), n, ct));
          } catch (e) { return null; }
      }
      /** Случайный секрет для QR: 22 символа без похожих букв. */
      function secret() {
          var a = 'abcdefghijkmnpqrstuvwxyz23456789', r = rnd(22), s = '';
          for (var i = 0; i < r.length; i++) s += a.charAt(r[i] % a.length);
          return s;
      }
      return { sha256: sha256, hmac: hmac, bytes: bytes, hex: hex, key: key, seal: seal, open: open, secret: secret };
  })();

  // В адресе после #: тема ntfy, которую слушает ТВ, и (новые ТВ) секрет через точку — токен шифруется им,
  // в кэше ntfy его не прочитать. Без секрета (старая Lampa) токен уходит как есть.
  var hash = (location.hash || '').replace(/^#/, '').split('.'), topic = hash[0], secret = hash[1] || '';
  var st = function (t, cls) { var e = document.getElementById('s'); e.textContent = t; e.className = cls || ''; };
  if (!/^lampa-[a-z0-9]{8,40}$/.test(topic)) st('Откройте эту страницу через QR-код на экране ТВ.', 'err');
  document.getElementById('b').onclick = function () {
    var tok = document.getElementById('t').value.replace(/\s+/g, '');
    var m = /(\d{6,12}:[A-Za-z0-9_-]{30,})/.exec(tok);
    if (!m) return st('Это не похоже на токен бота. Скопируйте его у @BotFather целиком.', 'err');
    if (!/^lampa-[a-z0-9]{8,40}$/.test(topic)) return st('Откройте эту страницу через QR-код на экране ТВ.', 'err');
    var b = this; b.disabled = true; st('Отправляю…');
    var x = new XMLHttpRequest();
    x.open('POST', 'https://ntfy.sh/' + topic, true);
    x.timeout = 20000;
    x.onload = function () { b.disabled = false; if (x.status < 300) st('✅ Отправлено. На ТВ появится «Токен получен» — теперь напишите своему боту любое сообщение.', 'ok'); else st('Не отправилось (' + x.status + '). Попробуйте ещё раз.', 'err'); };
    x.onerror = x.ontimeout = function () { b.disabled = false; st('Нет связи — проверьте интернет и нажмите ещё раз.', 'err'); };
    x.send(secret ? JSON.stringify(Crypt.seal(Crypt.key('lampa-pair-v2|' + secret), m[1])) : m[1]);
  };
</script>
</body>
</html>

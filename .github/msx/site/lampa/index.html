<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lampa · Sunic Apps</title>
<style>html, body { margin: 0; height: 100%; background: #1d1f20; }</style>
<script>
/*
 * Lampa «Sunic Apps» для Media Station X (sunic.stream, хостинг в Узбекистане — не Cloudflare, который у провайдеров
 * блокируют диапазонами). MSX открывает эту страницу сразу при старте (msx/start.json → "action": "link:…").
 * Здесь только загрузчик: index.html последнего выпуска (version.json в main) с jsDelivr по тегу, файлы — оттуда же
 * (<base>). Обновлять этот файл не нужно: новые выпуски приходят сами. Только http: источники Skaz работают по http.
 */
(function () {
    var GH = 'https://raw.githubusercontent.com/sunic007/lampa-samsung/main/version.json';
    var CDN = 'https://cdn.jsdelivr.net/gh/sunic007/lampa-samsung@v';
    var PIN = '2.3.4';   // если GitHub не ответил и ничего не запомнено
    function get(u) {
        try { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return x.status === 200 ? x.responseText : ''; }
        catch (e) { return ''; }
    }
    function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
    // в MSX нет API Samsung (window.tizen): плеер «Tizen» (AVPlay) не запустится — встроенный плеер Lampa
    // (loader.js на первом запуске ставит «tizen», если bs_player_default нет — ставим его раньше)
    if (!window.tizen) {
        ls('bs_player_default', '1');
        ['player', 'player_iptv'].forEach(function (k) { var p = ls(k); if (!p || p === 'tizen') ls(k, 'inner'); });
    }
    var v = '';
    try { v = JSON.parse(get(GH + '?t=' + Date.now())).version; } catch (e) {}
    if (/^\d+\.\d+\.\d+$/.test(v || '')) ls('bs_msx_ver', v);
    else v = ls('bs_msx_ver') || PIN;
    var html = get(CDN + v + '/src/index.html');
    if (!html && v !== PIN) { v = PIN; html = get(CDN + v + '/src/index.html'); }
    if (!html) {
        document.write('<p style="color:#fff;font:28px sans-serif;padding:60px">Нет связи с GitHub/jsDelivr — проверьте интернет и откройте снова.</p>');
        return;
    }
    // файлы — с другого домена (jsDelivr): их ошибки браузер отдаёт без текста («Script error.»), Lampa показывает
    // это уведомлением, а понять по нему нечего — глушим только такие, до обработчика Lampa
    var quiet = '<script>window.addEventListener("error", function (e) { if (!e.lineno && /^Script error\\.?$/i.test(e.message || "")) {' +
        ' try { e.stopImmediatePropagation(); } catch (x) {} } }, true);<\/script>';
    html = html
        .replace('<head>', '<head>\n    <base href="' + CDN + v + '/src/">\n    ' + quiet)
        .replace(/<script src="\$WEBAPIS\/webapis\/webapis\.js"><\/script>/, '')   // есть только у установленного .wgt
        .replace('<title>Lampa</title>', '<title>Lampa · Sunic Apps</title>');
    document.open();
    document.write(html);
    document.close();
})();
</script>
</head>
<body></body>
</html>

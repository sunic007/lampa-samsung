# Cloudflare Worker бота группы t.me/sunicapps (бесплатный тариф). Развернуть: npx wrangler deploy (из этой папки).
# Секреты — npx wrangler secret put <ИМЯ>: TELEGRAM_BOT_TOKEN, SUPPORT_TOKEN, LLM_API_KEY, WEBHOOK_SECRET.
name = "sunicapps-support"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
SUPPORT_GROUP = "sunicapps"

[observability]
enabled = true

# суточные счётчики, справочная база, повторы обновлений
[[kv_namespaces]]
binding = "STATE"
id = "697a3624d06a44a7bba534888981d001"

# отчёты о проблеме с ТВ, пришедшие через ntfy (report.js pollNtfy): раз в 10 минут
[triggers]
crons = ["*/10 * * * *"]

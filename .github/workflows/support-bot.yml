name: Support bot

# Бот группы t.me/sunicapps работает на Cloudflare Worker (.github/support/worker): Telegram присылает сообщения туда сам,
# ответ за секунды, бесплатно. Здесь — только самопроверка ответов на тестовых сообщениях (selftest, ничего не отправляет)
# с той же справочной базой. Прежний опрос по расписанию отключён: при подключённом webhook Telegram не отдаёт
# getUpdates, а «дежурство» на GitHub Actions — серая зона правил GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Self-test answers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.SUPPORT_LLM_KEY }}
          LLM_MODEL: ${{ vars.SUPPORT_LLM_MODEL }}
          SUPPORT_GROUP: sunicapps
        run: python3 .github/support/bot.py selftest

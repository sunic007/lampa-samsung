name: Support bot

# Группа «Sunic Apps — вопросы и помощь» (t.me/sunicapps): бот отвечает на вопросы по README/CHANGELOG, ошибки и
# предложения превращает в задачи (метка from-telegram, без имён) и принимает оценки ⭐. Код и тесты — .github/support/.
# «На дежурстве» (bot.py serve): один запуск до 5 ч 40 мин держит длинный опрос Telegram — ответ за секунды. Короткие
# запуски по расписанию GitHub не годились: «*/5» на деле срабатывал раз в 4–5 часов (17.10.2026). В конце смены запуск
# сам ставит следующий (workflow_dispatch от GITHUB_TOKEN разрешён); расписание раз в час — страховка, если цепочка
# прервалась. Один дежурный за раз (concurrency); пробные запуски (dry_run, selftest) — отдельно, коротко.
# Секреты: TELEGRAM_BOT_TOKEN (бот, без вебхука, privacy mode выключен), SUPPORT_TOKEN (PAT: Issues
# read/write на lampa-samsung и tvinstaller; нет — только ответы), SUPPORT_LLM_KEY (ключ Gemini/Groq/
# OpenRouter; нет — простые правила по словам). Переменные (необязательно): SUPPORT_LLM_MODEL, SUPPORT_CHAT_ID.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать решения в журнале: ничего не отправлять и не подтверждать'
        type: boolean
        default: false
      selftest:
        description: 'Самопроверка: тестовые сообщения, ответы — в журнал (ничего не отправляется)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write   # поставить следующую смену

concurrency:
  group: support-bot-${{ (inputs.dry_run || inputs.selftest) && 'test' || 'live' }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # счётчики за сутки (запросы к ИИ, по людям) — между запусками; кэш неизменяемый: новый ключ на каждый запуск
      - name: Restore daily counters
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .support-state
          key: support-state-${{ github.run_id }}
          restore-keys: support-state-

      - name: Poll the help group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPPORT_TOKEN: ${{ secrets.SUPPORT_TOKEN }}
          LLM_API_KEY: ${{ secrets.SUPPORT_LLM_KEY }}
          LLM_MODEL: ${{ vars.SUPPORT_LLM_MODEL }}
          SUPPORT_CHAT_ID: ${{ vars.SUPPORT_CHAT_ID }}
          SUPPORT_GROUP: sunicapps
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SUPPORT_STATE: .support-state/state.json
          LLM_PER_DAY: ${{ vars.SUPPORT_LLM_PER_DAY }}
          LLM_PER_USER_DAY: ${{ vars.SUPPORT_LLM_PER_USER_DAY }}
          SERVE_MINUTES: '340'
        run: python3 .github/support/bot.py ${{ inputs.selftest && 'selftest' || inputs.dry_run && 'poll' || 'serve' }}

      - name: Save daily counters
        if: always() && hashFiles('.support-state/state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .support-state
          key: support-state-${{ github.run_id }}

      - name: Next shift
        if: ${{ !cancelled() && !inputs.dry_run && !inputs.selftest }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run support-bot.yml -R "${{ github.repository }}" || echo "следующую смену поставит расписание"

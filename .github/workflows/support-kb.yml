name: Support knowledge base

# Справочная база бота группы (.github/support/kb.txt) — из README и CHANGELOG Lampa для Samsung, TV Installer и
# Sunic Apps для Lampa на Android (bot.py kb). Бот на Cloudflare Worker берёт её готовой (там на сообщение — 10 мс
# процессора, разбирать README некогда). Пересборка — при изменении README/CHANGELOG здесь и раз в сутки (README
# двух других проектов — в своих репозиториях).
on:
  push:
    branches: [main]
    paths: ['.github/README.ru.md', '.github/CHANGELOG.md', '.github/support/bot.py']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: support-kb
  cancel-in-progress: false

jobs:
  kb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and commit if changed
        run: |
          python3 .github/support/bot.py kb > .github/support/kb.txt
          [ -s .github/support/kb.txt ] || { echo "пустая база — не записываю"; exit 1; }
          if git diff --quiet -- .github/support/kb.txt; then echo "без изменений"; exit 0; fi
          git config user.name sunic007
          git config user.email 199752350+sunic007@users.noreply.github.com
          git add .github/support/kb.txt
          git commit -m "Справочная база бота поддержки обновлена (автоматически)"
          git pull --rebase -q origin main && git push -q origin HEAD:main

name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Unit tests
        run: node tests/run.cjs

      # Старые телевизоры Samsung (Tizen 2.3–5) понимают только ES5: стрелочные функции, let/const и т. п. их ломают
      - name: ES5 syntax (own modules)
        run: |
          for f in src/update.js src/loader.js src/bs*.js src/skazauto.js src/playerguard.js src/polyfills.js; do
            npx -y acorn@8.14.0 --ecma5 --silent "$f" || { echo "::error file=$f::not ES5"; exit 1; }
          done

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Package builds
        run: python tools/pack.py && git diff --exit-code version.json

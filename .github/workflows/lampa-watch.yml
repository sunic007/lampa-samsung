name: Lampa update watch

# Новая Lampa на сервере Skaz (lampa.byskaz.ru) — сама выпускает пакет с обновлённой запасной копией:
#   обновить src/app.js и ресурсы → автотесты → проверка в браузере (tests/browser-smoke.mjs: новая Lampa + плагины Skaz +
#   наши модули) → версия +patch, CHANGELOG, NOTICES → сборка → релиз → jsDelivr → пост в Telegram-канал → старый релиз удалён.
# Тесты или проверка в браузере не прошли — релиза нет: pull request с отчётом, разбирает человек.
# Раз в час: сборки Skaz выходят раз в 1–3 дня, иногда дважды в день (16.10.2026), а ТВ берут ядро с сервера сразу.
# Номер Lampa тот же, а прошлый автовыпуск был меньше суток назад — релиз откладывается (не засорять канал; ТВ и так
# работают с ядром с сервера, запасная копия догонит при следующей проверке после суток).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпускать сразу (иначе только pull request)'
        type: boolean
        default: true
      notify_test:
        description: 'Только проверить личное уведомление владельцу в Telegram'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: lampa-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Compare versions
        id: cmp
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, os
          a = json.load(urllib.request.urlopen(urllib.request.Request('http://lampa.byskaz.ru/lampa-main/assembly.json?t=1', headers={'User-Agent': 'Mozilla/5.0'}), timeout=60))
          loader = open('src/loader.js', encoding='utf-8').read()
          have_v = re.search(r"var BS_BUNDLED_VERSION = '([^']*)'", loader).group(1)
          have_h = re.search(r"var BS_BUNDLED_HASH = '([^']*)'", loader).group(1)
          new = a['hash'] != have_h
          print('Skaz:', a['app_version'], a['hash'], '| в пакете:', have_v, have_h, '| новая:', new)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('new=%s\nversion=%s\nhash=%s\nhave=%s\n' % ('1' if new else '', a['app_version'], a['hash'], have_v))
          PY
      - name: Update bundled copy and test
        id: upd
        if: steps.cmp.outputs.new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/update_bundled.py
          if node tests/run.cjs > tests.log 2>&1 || node tests/run.cjs > tests.log 2>&1; then
            # проверка в браузере с новой копией ядра (её hash = hash сервера → loader берёт копию из пакета)
            npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
            set +e; node tests/browser-smoke.mjs --report smoke-report.json > smoke.log 2>&1; code=$?; set -e
            tail -40 smoke.log
            # 3 — серверы Skaz/byskaz не ответили: это не поломка нашей стороны, выпускать можно
            if [ "$code" = "0" ] || [ "$code" = "3" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "проверка в браузере: $(python3 -c "import json;print('; '.join(json.load(open('smoke-report.json'))['problems']))" 2>/dev/null)" >> tests.log; fi
          fi
          echo "tests=$(tail -1 tests.log)" >> "$GITHUB_OUTPUT"
          # что поменялось у yumata: коммиты lampa-source за 10 дней (точной привязки сборки Skaz к коммиту нет)
          SINCE=$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/yumata/lampa-source/commits?since=$SINCE&per_page=20" \
            -q '.[] | "- " + (.commit.message|split("\n")[0]) + " (" + .commit.committer.date[0:10] + ", [" + .sha[0:7] + "](" + .html_url + "))"' > changes.md \
            || echo "- (не удалось получить список)" > changes.md
          gh api "repos/yumata/lampa-source/commits?per_page=1" -q '.[0].sha' > src_sha.txt || echo "" > src_sha.txt
      - name: Release throttle
        id: thr
        if: steps.cmp.outputs.new && steps.upd.outputs.ok
        env:
          VERSION: ${{ steps.cmp.outputs.version }}
          HAVE: ${{ steps.cmp.outputs.have }}
        run: |
          last=$(git log -1 --format=%ct --grep='(автоматически, Skaz' || echo 0); age=$(( $(date +%s) - ${last:-0} ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$VERSION" = "$HAVE" ] && [ "$age" -lt 86400 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Новая сборка Lampa $VERSION (тот же номер), прошлый автовыпуск $((age / 3600)) ч назад — релиз отложен до суток" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release automatically
        if: steps.cmp.outputs.new && steps.upd.outputs.ok && !steps.thr.outputs.skip && (github.event_name == 'schedule' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cmp.outputs.version }}
          HASH: ${{ steps.cmp.outputs.hash }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git config user.name sunic007
          git config user.email 199752350+sunic007@users.noreply.github.com
          SRC_SHA=$(cat src_sha.txt)
          # следующая версия пакета (patch) — и запись в CHANGELOG до сборки: из неё берутся заметки для окна на ТВ
          NEXT=$(python3 -c "import re;v=re.search(r'<widget[^>]*\sversion=\"(\d+)\.(\d+)\.(\d+)\"',open('src/config.xml',encoding='utf-8').read()).groups();print('%s.%s.%d'%(v[0],v[1],int(v[2])+1))")
          python3 - "$NEXT" "$VERSION" "$SRC_SHA" <<'PY'
          import io, re, sys
          nxt, ver, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          p = '.github/CHANGELOG.md'; s = io.open(p, encoding='utf-8', newline='').read(); nl = '\r\n' if '\r\n' in s else '\n'
          entry = nl.join(['## %s — Lampa %s внутри пакета' % (nxt, ver),
                           '- Запасная копия Lampa внутри пакета обновлена до свежей сборки %s (как на сервере Skaz): Lampa запускается из пакета, без загрузки ядра из сети.' % ver,
                           '- Сделано автоматически: новая Lampa на сервере Skaz → тесты → выпуск.', '', ''])
          i = s.index('\n## ') + 1
          s = s[:i] + entry + s[i:]
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          if sha:
              p = 'licenses/THIRD_PARTY_NOTICES.md'; s = io.open(p, encoding='utf-8', newline='').read()
              s = re.sub(r'The bundled Lampa build is version \*\*[\d.]+\*\*', 'The bundled Lampa build is version **%s**' % ver, s)
              s = re.sub(r'\[yumata/lampa-source, version [\d.]+\]\(https://github\.com/yumata/lampa-source/tree/[0-9a-f]+\)',
                         '[yumata/lampa-source, version %s](https://github.com/yumata/lampa-source/tree/%s)' % (ver, sha), s)
              io.open(p, 'w', encoding='utf-8', newline='').write(s)
          PY
          python3 tools/pack.py --bump patch
          V=$(python3 -c "import json;print(json.load(open('version.json',encoding='utf-8'))['version'])")
          [ "$V" = "$NEXT" ] || { echo "версия $V, ожидалась $NEXT"; exit 1; }
          git add -A src .github/CHANGELOG.md licenses version.json
          git commit -m "$V: Lampa $VERSION внутри пакета (автоматически, Skaz $HASH)"
          git tag "v$V"
          git push origin HEAD:main "v$V"
          PREV=$(gh release list -R "$REPO" --limit 1 --json tagName -q '.[0].tagName' || true)
          {
            echo "**RU**"
            echo "- Запасная копия Lampa внутри пакета обновлена до свежей сборки $VERSION (как на сервере Skaz)."
            echo "- Выпущено автоматически после автотестов ($(tail -1 tests.log))."
            echo
            echo "**EN**"
            echo "- The bundled Lampa copy was updated to the latest $VERSION build (as on the Skaz server). Released automatically after tests."
            echo
            echo "Изменения у yumata (lampa-source):"
            cat changes.md
            echo
            echo "Установка: скачайте **samsung.wgt** ниже. Включённые ТВ обновятся сами."
          } > notes.md
          gh release create "v$V" -R "$REPO" --title "$V — Lampa $VERSION внутри пакета" --notes-file notes.md --latest "dist/samsung-$V.wgt" samsung.wgt
          # все файлы модулей — на jsDelivr (ТВ берут их оттуда), до 10 минут
          python3 - "$V" <<'PY'
          import json, sys, time, urllib.request
          v = sys.argv[1]; files = ['src/' + f for f in json.load(open('version.json', encoding='utf-8'))['files']] + ['version.json']
          for _ in range(20):
              ok = 0
              for f in files:
                  try: ok += urllib.request.urlopen('https://cdn.jsdelivr.net/gh/sunic007/lampa-samsung@v%s/%s' % (v, f), timeout=20).status == 200
                  except Exception: pass
              print('jsDelivr %d/%d' % (ok, len(files)))
              if ok == len(files): break
              time.sleep(30)
          PY
          # релиз от GITHUB_TOKEN не запускает другие workflow по событию release — пост в канал запускаем сами
          gh workflow run telegram-post.yml -R "$REPO" -f tag="v$V" || true
          if [ -n "$PREV" ] && [ "$PREV" != "v$V" ]; then gh release delete "$PREV" -R "$REPO" --yes || true; fi
      - name: Tell the owner — Lampa updated itself
        # владельцу лично (vars.OWNER_TG_CHAT, бот @sunicapps_news_bot): что обновилось и что нового
        if: steps.cmp.outputs.new && steps.upd.outputs.ok && !steps.thr.outputs.skip && (github.event_name == 'schedule' || inputs.release)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.OWNER_TG_CHAT }}
          VERSION: ${{ steps.cmp.outputs.version }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "нет TELEGRAM_BOT_TOKEN или vars.OWNER_TG_CHAT — пропускаю"; exit 0; }
          V=$(python3 -c "import json;print(json.load(open('version.json',encoding='utf-8'))['version'])")
          python3 - "$V" <<'PY'
          import os, sys, urllib.parse, urllib.request
          v = sys.argv[1]
          ch = open('changes.md', encoding='utf-8').read().strip() if os.path.exists('changes.md') else ''
          lines = [l for l in ch.splitlines() if l.strip()][:8]
          nl = chr(10)
          text = ('🔄 Lampa обновилась сама — Sunic Apps %s' % v + nl + nl +
                  'Внутри — свежая Lampa %s (как на сервере Skaz). Автотесты и проверка в браузере прошли, ' % os.environ['VERSION'] +
                  'ТВ, Android и sunic.stream обновятся сами.' + nl)
          if lines: text += nl + 'Что нового у Lampa (lampa-source):' + nl + nl.join(lines) + nl
          text += nl + 'sunic.stream'
          d = urllib.parse.urlencode({'chat_id': os.environ['TG_CHAT'], 'text': text[:4000], 'disable_web_page_preview': 'true'}).encode()
          try: print('telegram', urllib.request.urlopen('https://api.telegram.org/bot%s/sendMessage' % os.environ['TG_TOKEN'], d, timeout=20).status)
          except Exception as e: print('telegram:', e)
          PY
      - name: Tests failed — pull request for a human
        if: steps.cmp.outputs.new && (!steps.upd.outputs.ok || (github.event_name == 'workflow_dispatch' && !inputs.release))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cmp.outputs.version }}
          HASH: ${{ steps.cmp.outputs.hash }}
          HAVE: ${{ steps.cmp.outputs.have }}
          TESTS: ${{ steps.upd.outputs.tests }}
        run: |
          n=$(gh pr list --head "lampa-$HASH" --state open --json number -q 'length')
          [ "$n" = "0" ] || { echo "pull request уже открыт"; exit 0; }
          git config user.name sunic007
          git config user.email 199752350+sunic007@users.noreply.github.com
          git checkout -b "lampa-$HASH"
          git add -A src
          git commit -m "Lampa $VERSION (Skaz $HASH) — запасная копия в пакете"
          git push -u origin "lampa-$HASH"
          {
            echo "На сервере Skaz вышла **Lampa $VERSION** (сборка \`$HASH\`). В пакете была $HAVE."
            echo
            echo "Автотесты: ${TESTS:-?} — автоматический выпуск остановлен, посмотрите лог в Actions."
            echo
            echo "Изменения у yumata (lampa-source, последние 10 дней):"
            cat changes.md
          } > body.md
          gh pr create --title "Lampa $VERSION — проверить: автотесты не прошли" --body-file body.md --head "lampa-$HASH" --base main
      - name: Tell the owner — update stopped
        if: steps.cmp.outputs.new && !steps.upd.outputs.ok
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.OWNER_TG_CHAT }}
          VERSION: ${{ steps.cmp.outputs.version }}
          TESTS: ${{ steps.upd.outputs.tests }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          text = ('⚠️ Вышла Lampa %s, но автотесты не прошли (%s) — сама она не обновилась. '
                  'Нужна проверка: pull request в sunic007/lampa-samsung.' % (os.environ['VERSION'], os.environ.get('TESTS') or '?'))
          d = urllib.parse.urlencode({'chat_id': os.environ['TG_CHAT'], 'text': text}).encode()
          try: urllib.request.urlopen('https://api.telegram.org/bot%s/sendMessage' % os.environ['TG_TOKEN'], d, timeout=20)
          except Exception as e: print('telegram:', e)
          PY
      - name: Owner notification test
        if: github.event_name == 'workflow_dispatch' && inputs.notify_test
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.OWNER_TG_CHAT }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "нет TELEGRAM_BOT_TOKEN или vars.OWNER_TG_CHAT"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          d = urllib.parse.urlencode({'chat_id': os.environ['TG_CHAT'], 'text': '✅ Проверка: сюда будут приходить сообщения, когда Lampa обновится сама.'}).encode()
          try: print('telegram ok:', json.load(urllib.request.urlopen('https://api.telegram.org/bot%s/sendMessage' % os.environ['TG_TOKEN'], d, timeout=20)).get('ok'))
          except Exception as e: print('telegram:', e); raise SystemExit(1)
          PY

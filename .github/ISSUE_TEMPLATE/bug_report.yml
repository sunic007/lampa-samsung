name: 🐞 Bug report / Ошибка
description: Something doesn't work / Что-то не работает
labels: [bug]
body:
  - type: input
    id: tv
    attributes:
      label: TV model and year / Модель и год ТВ / Televizor modeli va yili
      placeholder: UE55BU8500 (2022)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version / Версия пакета / Paket versiyasi
      description: Settings → Sunic Apps → «Обновление» / Настройки → Sunic Apps → Обновление
      placeholder: "2.2.4"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Где / Qayerda
      options: [Player / Плеер, Telegram bot / Telegram-бот, Updates / Обновление, Startup / Запуск, Other / Другое]
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло / Nima bo'ldi
      description: Steps, a photo of the TV screen / Шаги, фото экрана ТВ
    validations:
      required: true
